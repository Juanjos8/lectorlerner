<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
<meta name="theme-color" content="#f5f4f0" />
<title>Consulta de precios · Librería Lerner</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link href="https://fonts.googleapis.com/css2?family=DM+Serif+Display&family=DM+Sans:wght@400;500;600&display=swap" rel="stylesheet" />
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
  :root {
    --bg: #f5f4f0; --surface: #ffffff; --border: #e2e0d8; --text: #1a1a18; --muted: #6b6a66;
    --accent: #534AB7; --accent-dark: #3C3489; --accent-light: #EEEDFE;
    --price: #0F6E56; --warn-bg: #FAEEDA; --warn-text: #854F0B;
    --radius: 10px; --radius-lg: 16px;
  }
  html, body { background: var(--bg); }
  body { font-family: "DM Sans", system-ui, sans-serif; color: var(--text); min-height: 100vh; min-height: 100dvh; display: flex; justify-content: center; padding: 12px 16px calc(16px + env(safe-area-inset-bottom)); }
  #app { width: 100%; max-width: 480px; display: flex; flex-direction: column; gap: 12px; }
  header { display: flex; align-items: center; justify-content: space-between; padding-top: 4px; }
  header img { height: 40px; width: auto; }
  header span { font-size: 13px; color: var(--muted); }

  .viewport { position: relative; background: #12121e; border-radius: var(--radius-lg); overflow: hidden; height: 46vh; min-height: 240px; max-height: 420px; }
  video { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; }
  .frame { position: absolute; left: 6%; right: 6%; top: 24%; bottom: 24%; border: 2px solid rgba(255,255,255,.85); border-radius: 12px; box-shadow: 0 0 0 100vmax rgba(0,0,0,.35); pointer-events: none; transition: border-color .2s; }
  .frame.hit { border-color: #5DCAA5; }
  .line { position: absolute; left: 6%; right: 6%; height: 2px; background: #AFA9EC; top: 50%; animation: scan 2s ease-in-out infinite; }
  @keyframes scan { 0%,100% { top: 15%; } 50% { top: 85%; } }
  .hint { position: absolute; left: 0; right: 0; bottom: 12px; text-align: center; color: #fff; font-size: 14px; font-weight: 500; text-shadow: 0 1px 3px rgba(0,0,0,.6); padding: 0 16px; }
  .hint small { font-size: 12px; font-weight: 400; opacity: .9; }
  .torch { position: absolute; top: 10px; right: 10px; width: 42px; height: 42px; border-radius: 50%; border: none; background: rgba(0,0,0,.45); color: #fff; display: flex; align-items: center; justify-content: center; cursor: pointer; }
  .torch svg { width: 22px; height: 22px; }
  .torch.on { background: #FAC775; color: #1a1a18; }
  .cover-msg { position: absolute; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 14px; color: #ddd; text-align: center; padding: 24px; font-size: 15px; line-height: 1.4; }
  .btn { appearance: none; border: none; border-radius: var(--radius); background: var(--accent); color: #fff; font: 600 16px "DM Sans", sans-serif; padding: 14px 22px; cursor: pointer; }
  .btn.secondary { background: var(--surface); color: var(--text); border: 1px solid var(--border); font-weight: 500; }

  #result { background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius-lg); padding: 16px; display: none; gap: 16px; animation: up .25s ease; }
  #result.show { display: flex; }
  @keyframes up { from { opacity: 0; transform: translateY(8px); } to { opacity: 1; transform: none; } }
  .cover { width: 92px; flex-shrink: 0; aspect-ratio: 2/3; border-radius: 6px; background: var(--accent-light); display: flex; align-items: center; justify-content: center; overflow: hidden; color: var(--accent); }
  .cover img { width: 100%; height: 100%; object-fit: cover; }
  .cover svg { width: 36px; height: 36px; opacity: .6; }
  .info { flex: 1; min-width: 0; display: flex; flex-direction: column; gap: 4px; }
  .title { font-family: "DM Serif Display", serif; font-size: 19px; line-height: 1.25; color: var(--accent-dark); overflow-wrap: anywhere; }
  .author { font-size: 14px; color: var(--muted); }
  .price-label { font-size: 11px; font-weight: 600; letter-spacing: .08em; text-transform: uppercase; color: var(--muted); margin-top: 10px; }
  .price { font-family: "DM Serif Display", serif; font-size: 38px; line-height: 1.1; color: var(--price); letter-spacing: -.5px; }
  .note { margin-top: 10px; background: var(--warn-bg); color: var(--warn-text); border-radius: var(--radius); padding: 10px 12px; font-size: 14px; line-height: 1.35; }
  #result.missing { flex-direction: column; gap: 6px; text-align: center; padding: 22px 16px; }
  #result.missing .title { font-size: 20px; }
  #result.missing p { font-size: 15px; color: var(--muted); line-height: 1.4; }
  .again { font-size: 13px; color: var(--muted); text-align: center; }

  details { background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius); }
  summary { list-style: none; cursor: pointer; padding: 12px 14px; font-size: 14px; color: var(--muted); }
  summary::-webkit-details-marker { display: none; }
  summary::after { content: " ›"; }
  details[open] summary::after { content: ""; }
  form { display: flex; gap: 8px; padding: 0 12px 12px; }
  form input { flex: 1; min-width: 0; font: 16px "DM Sans", sans-serif; padding: 12px; border: 1px solid var(--border); border-radius: var(--radius); background: var(--bg); color: var(--text); outline: none; }
  form input:focus { border-color: var(--accent); }
  form .btn { padding: 12px 16px; font-size: 15px; }
  footer { text-align: center; font-size: 12px; color: var(--muted); margin-top: auto; padding-top: 8px; line-height: 1.5; }
  [hidden] { display: none !important; }
</style>
</head>

<script>
const SHEET_URL = "https://docs.google.com/spreadsheets/d/e/2PACX-1vQQ_qp9KAm1Augwa00PtLN0bfayFugg3bEeQ-UYwFNu-VPLV5NsaJi3vqrkKk-4q4N0Sri5d1rFCoE-/pub?gid=1959812276&single=true&output=csv";
const CACHE_MAX_AGE = 30 * 60 * 1000; // refresca precios si el caché tiene más de 30 min

const $ = id => document.getElementById(id);
let byIsbn = new Map(), byLerner = new Map(), ready = false, pending = null;

/* ── Datos ─────────────────────────────────────────────── */
function parseCSV(text) {
  const rows = []; let row = [], cur = '', q = false;
  for (let i = 0; i < text.length; i++) {
    const c = text[i];
    if (q) {
      if (c === '"') { if (text[i + 1] === '"') { cur += '"'; i++; } else q = false; }
      else cur += c;
    } else if (c === '"') q = true;
    else if (c === ',') { row.push(cur); cur = ''; }
    else if (c === '\n') { row.push(cur); rows.push(row); row = []; cur = ''; }
    else if (c !== '\r') cur += c;
  }
  if (cur || row.length) { row.push(cur); rows.push(row); }
  return rows;
}
const digits = s => (s || '').replace(/\D/g, '');
function buildIndex(text) {
  const rows = parseCSV(text);
  const h = rows[0].map(x => x.trim().toLowerCase());
  const col = name => h.indexOf(name);
  const iI = col('isbn'), iL = col('codigo lerner'), iT = col('titulo'), iA = col('autor'), iP = col('precio');
  byIsbn = new Map(); byLerner = new Map();
  for (let r = 1; r < rows.length; r++) {
    const c = rows[r];
    const isbn = (c[iI] || '').trim().toUpperCase();
    if (!isbn) continue;
    const book = { isbn, lerner: (c[iL] || '').trim(), titulo: (c[iT] || '').trim(), autor: (c[iA] || '').trim(), precio: parseInt(digits(c[iP])) || 0 };
    const key = isbn.replace(/[^0-9X]/g, '');
    if (!byIsbn.has(key)) byIsbn.set(key, []);
    byIsbn.get(key).push(book);
    if (book.lerner) byLerner.set(book.lerner.toUpperCase(), book);
  }
}
function idb() {
  return new Promise((res, rej) => {
    const r = indexedDB.open('lerner-consulta', 1);
    r.onupgradeneeded = () => r.result.createObjectStore('kv');
    r.onsuccess = () => res(r.result); r.onerror = () => rej(r.error);
  });
}
async function cacheGet() {
  try { const db = await idb(); return await new Promise(res => { const g = db.transaction('kv').objectStore('kv').get('csv'); g.onsuccess = () => res(g.result); g.onerror = () => res(null); }); }
  catch (e) { return null; }
}
async function cachePut(text) {
  try { const db = await idb(); db.transaction('kv', 'readwrite').objectStore('kv').put({ text, t: Date.now() }, 'csv'); } catch (e) {}
}
async function fetchCSV() {
  const r = await fetch(SHEET_URL, { cache: 'no-store' });
  if (!r.ok) throw new Error(r.status);
  const text = await r.text();
  if (!/^\s*isbn/i.test(text)) throw new Error('formato');
  return text;
}
function markReady() {
  ready = true;
  if (pending) { const c = pending; pending = null; lookup(c); }
}
async function loadData() {
  const cached = await cacheGet();
  if (cached && cached.text) {
    buildIndex(cached.text); markReady();
    if (Date.now() - cached.t < CACHE_MAX_AGE) return;
  }
  try {
    const text = await fetchCSV();
    buildIndex(text); cachePut(text); markReady();
  } catch (e) {
    if (!ready) $('footer').textContent = 'No pudimos cargar los precios. Revisa tu conexión y recarga la página.';
  }
}

/* ── Resultado ─────────────────────────────────────────── */
const esc = s => s.replace(/[&<>"']/g, ch => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[ch]));
const fmt = n => '$ ' + n.toLocaleString('es-CO');
function niceAuthor(a) {
  if (!a) return '';
  if (/^VV\.?\s*AA\.?$/i.test(a)) return 'Varios autores';
  const parts = a.split(',').map(s => s.trim()).filter(Boolean);
  const name = parts.length === 2 ? parts[1] + ' ' + parts[0] : a;
  return name.toLowerCase().replace(/(^|[\s\-'’.])(\p{L})/gu, (m, p, l) => p + l.toUpperCase())
    .replace(/\b(De|Del|La|Las|Los|Y|Da|Do|Dos|Van|Von|Di)\b/g, w => w.toLowerCase())
    .replace(/^(\p{L})/u, l => l.toUpperCase());
}
const bookIcon = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="M4 19.5A2.5 2.5 0 0 1 6.5 17H20V3H6.5A2.5 2.5 0 0 0 4 5.5z"/><path d="M4 19.5A2.5 2.5 0 0 0 6.5 22H20v-5"/></svg>';

function findBooks(raw) {
  const code = raw.trim().toUpperCase();
  if (byLerner.has(code)) return [byLerner.get(code)];
  const key = code.replace(/[^0-9X]/g, '');
  for (const k of [key, '0' + key, key.replace(/^0+/, '')]) if (k && byIsbn.has(k)) return byIsbn.get(k);
  return [];
}

let shownCode = null, coverToken = 0;
function lookup(raw) {
  if (!ready) { pending = raw; showLoading(); return; }
  const books = findBooks(raw);
  shownCode = raw;
  const box = $('result');
  box.className = 'show';
  if (!books.length) {
    box.classList.add('missing');
    box.innerHTML = `<div class="title">No encontramos el precio de este libro</div><p>Pregúntale a un librero, con gusto te ayuda.</p>`;
  } else {
    const b = books[0];
    const prices = [...new Set(books.map(x => x.precio).filter(Boolean))];
    const priceHTML = prices.length === 1
      ? `<div class="price-label">Precio</div><div class="price">${fmt(prices[0])}</div>`
      : `<div class="note">Pregúntale a un librero por el precio de este libro.</div>`;
    box.innerHTML = `
      <div class="cover" id="cover">${bookIcon}</div>
      <div class="info">
        <div class="title">${esc(b.titulo || 'Sin título')}</div>
        <div class="author">${esc(niceAuthor(b.autor))}</div>
        ${priceHTML}
      </div>`;
    loadCover(b.isbn);
  }
  $('again').hidden = !scanning;
  box.scrollIntoView({ behavior: 'smooth', block: 'nearest' });
}
function showLoading() {
  const box = $('result');
  box.className = 'show missing';
  box.innerHTML = `<p>Cargando precios…</p>`;
}
async function loadCover(isbn) {
  const token = ++coverToken;
  const clean = isbn.replace(/[^0-9X]/g, '');
  if (clean.length !== 10 && clean.length !== 13) return;
  const put = url => new Promise(res => {
    const img = new Image();
    img.onload = () => { if (token === coverToken && img.naturalWidth > 10) { const c = $('cover'); if (c) { c.innerHTML = ''; img.alt = ''; c.appendChild(img); } res(true); } else res(false); };
    img.onerror = () => res(false);
    img.src = url;
  });
  // Solo Google Books, y solo si el libro que devuelve tiene exactamente este ISBN:
  // una portada equivocada confunde más que no mostrar ninguna.
  try {
    const r = await fetch(`https://www.googleapis.com/books/v1/volumes?q=isbn:${clean}&fields=items(volumeInfo(industryIdentifiers,imageLinks))`);
    const j = await r.json();
    const item = (j.items || []).find(it => (it.volumeInfo.industryIdentifiers || []).some(id => id.identifier.replace(/[^0-9X]/gi, '').toUpperCase() === clean));
    const links = item && item.volumeInfo.imageLinks;
    const url = links && (links.thumbnail || links.smallThumbnail);
    if (url) await put(url.replace(/^http:/, 'https:').replace('&edge=curl', ''));
  } catch (e) {}
}

/* ── Cámara ────────────────────────────────────────────── */
// Solo se analiza la zona del recuadro, ampliada: así el código pequeño de un libro
// ocupa muchos más píxeles y se lee más rápido. Se valida el dígito de control
// para descartar lecturas falsas.
let scanning = false, resumeCam = false, stream = null, track = null, lastCode = null, lastTime = 0, detector = null, frameN = 0;
let detectorReady = null;
const crop = document.createElement('canvas');
const cctx = crop.getContext('2d', { willReadFrequently: true });

function validEAN(code) {
  if (!/^\d+$/.test(code) || ![8, 12, 13].includes(code.length)) return /^[0-9A-Z\-]{4,}$/i.test(code) && code.length > 13;
  const d = code.split('').map(Number), check = d.pop();
  let sum = 0;
  d.reverse().forEach((n, i) => { sum += n * (i % 2 === 0 ? 3 : 1); });
  return (10 - (sum % 10)) % 10 === check;
}
function onCode(code) {
  code = String(code).trim();
  if (!validEAN(code)) return;
  const now = Date.now();
  if (code === lastCode && now - lastTime < 3000) return;
  lastCode = code; lastTime = now;
  if (navigator.vibrate) navigator.vibrate(60);
  $('frame').classList.add('hit'); setTimeout(() => $('frame').classList.remove('hit'), 400);
  lookup(code);
}
// Lector: el nativo del teléfono si sabe leer EAN-13 (Android); si no (iPhone),
// zxing-cpp compilado a WebAssembly, que lee mucho mejor que la librería anterior.
const POLYFILL = 'https://cdn.jsdelivr.net/npm/barcode-detector@3.2.2/dist/es/ponyfill.js/+esm';
const FORMATS = ['ean_13', 'ean_8', 'upc_a'];
async function makeDetector() {
  if ('BarcodeDetector' in window) {
    try {
      const f = await BarcodeDetector.getSupportedFormats();
      if (f.includes('ean_13')) return new BarcodeDetector({ formats: FORMATS.filter(x => f.includes(x)) });
    } catch (e) {}
  }
  const { BarcodeDetector: Poly } = await import(POLYFILL);
  return new Poly({ formats: FORMATS });
}
// Copia al canvas la parte del video que se ve dentro del recuadro (con margen).
function grabCrop(video) {
  const vw = video.videoWidth, vh = video.videoHeight;
  if (!vw || !vh) return false;
  const W = video.clientWidth, H = video.clientHeight;
  const s = Math.max(W / vw, H / vh);            // object-fit: cover
  const visW = W / s, visH = H / s, offX = (vw - visW) / 2, offY = (vh - visH) / 2;
  const sx = offX + visW * 0.04, sw = visW * 0.92;
  const sy = offY + visH * 0.22, sh = visH * 0.56;
  const scale = Math.min(2, 1600 / sw);          // amplía si el recorte es pequeño
  crop.width = Math.round(sw * scale); crop.height = Math.round(sh * scale);
  cctx.imageSmoothingEnabled = true;
  cctx.drawImage(video, sx, sy, sw, sh, 0, 0, crop.width, crop.height);
  return true;
}
async function scanLoop(video) {
  if (!scanning) return;
  try {
    if (detector && grabCrop(video)) {
      frameN++;
      const r = await detector.detect(crop);
      if (r.length) onCode(r[0].rawValue);
      else if (frameN % 4 === 0) { const r2 = await detector.detect(video); if (r2.length) onCode(r2[0].rawValue); }
    }
  } catch (e) {}
  setTimeout(() => requestAnimationFrame(() => scanLoop(video)), 60);
}
async function tuneTrack() {
  const caps = track.getCapabilities ? track.getCapabilities() : {};
  const adv = [];
  if (caps.focusMode && caps.focusMode.includes('continuous')) adv.push({ focusMode: 'continuous' });
  // Un poco de zoom permite sostener el libro más lejos, donde la cámara sí enfoca.
  if (caps.zoom && caps.zoom.max >= 1.5) adv.push({ zoom: Math.min(2, caps.zoom.max) });
  for (const a of adv) { try { await track.applyConstraints({ advanced: [a] }); } catch (e) {} }
  if (caps.torch) $('btn-torch').hidden = false;
}
async function startCamera() {
  $('btn-cam').hidden = true;
  $('cam-text').textContent = 'Abriendo la cámara…';
  $('cam-msg').hidden = false;
  try {
    stream = await navigator.mediaDevices.getUserMedia({ audio: false, video: { facingMode: { ideal: 'environment' }, width: { ideal: 1920 }, height: { ideal: 1080 } } });
    track = stream.getVideoTracks()[0];
    await tuneTrack();
    const video = $('video');
    video.srcObject = stream;
    await video.play();
    video.hidden = false; $('frame').hidden = false; $('hint').hidden = false; $('cam-msg').hidden = true;
    scanning = true;
    await detectorReady;
    if (!detector) { $('manual').open = true; }
    scanLoop(video);
  } catch (e) {
    scanning = false;
    const denied = e && (e.name === 'NotAllowedError' || e.name === 'SecurityError');
    $('cam-text').textContent = denied
      ? 'Necesitamos permiso para usar la cámara. Tócalo abajo y acepta, o escribe el ISBN.'
      : 'No pudimos abrir la cámara. Puedes escribir el ISBN del libro.';
    $('btn-cam').hidden = false;
    if (!denied) $('manual').open = true;
  }
}
function stopCamera() {
  scanning = false;
  if (stream) stream.getTracks().forEach(t => t.stop());
  stream = null; track = null;
  $('video').hidden = true; $('frame').hidden = true; $('hint').hidden = true; $('btn-torch').hidden = true;
  $('btn-torch').classList.remove('on');
}
$('btn-cam').addEventListener('click', startCamera);
$('btn-torch').addEventListener('click', async e => {
  e.stopPropagation();
  if (!track) return;
  const on = !$('btn-torch').classList.contains('on');
  try { await track.applyConstraints({ advanced: [{ torch: on }] }); $('btn-torch').classList.toggle('on', on); } catch (err) {}
});
$('viewport').addEventListener('click', async () => {
  if (!track) return;
  try { await track.applyConstraints({ advanced: [{ focusMode: 'single' }] }); setTimeout(() => track && track.applyConstraints({ advanced: [{ focusMode: 'continuous' }] }).catch(() => {}), 800); } catch (e) {}
});
document.addEventListener('visibilitychange', () => {
  if (document.hidden && stream) { stopCamera(); resumeCam = true; }
  else if (!document.hidden && resumeCam && !stream) { resumeCam = false; startCamera(); }
});

/* ── Búsqueda manual ───────────────────────────────────── */
$('form').addEventListener('submit', e => {
  e.preventDefault();
  const v = $('code').value.trim();
  if (!v) return;
  lookup(v); $('code').value = ''; $('code').blur();
});

detectorReady = makeDetector().then(d => (detector = d)).catch(() => null);
loadData();
if (navigator.mediaDevices && navigator.mediaDevices.getUserMedia) startCamera();
else { $('cam-text').textContent = 'Este navegador no permite usar la cámara. Escribe el ISBN del libro.'; $('manual').open = true; }
</script>
</body>
</html>
